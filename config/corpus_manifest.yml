# Corpus for the jurisdictional scan assistant. Public filings, plus documents marked access: internal.
#
# source_path is relative to the corpus root (local: ./reports or ./interviewer/corpus,
# workspace: the raw UC volume). .pdf files are parsed per page; .txt files split pages on form feeds.
# Every source_path is checked against an exclusion list before upload and before parsing; a match
# aborts the run. The list lives in an interviewer-only file. Add documents here, never by dropping
# files in the volume.
#
# superseded_by: for an application, the AUC decision that rules on it (approved != applied).

